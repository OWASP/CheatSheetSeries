name: Markdown Link Check

# Pull requests to every branch check external links they add and block on
# newly broken local links, regardless of changed paths, author, or draft status.
# Pushes to master check local links only. The weekly and manual runs are fresh
# full audits whose failures are maintenance work.
on:
  pull_request:
    # Retargeting changes the comparison base; leaving draft also reruns checks.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches:
    - master
  schedule:
  - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      fresh:
        description: Ignore cached successes
        type: boolean
        default: true

permissions: {}

concurrency:
  group: md-link-check-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  link-check:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
      # Only default-branch audits produce trusted success evidence. PRs from
      # this repository may read it; fork PRs neither restore nor save caches.
      CACHE_PREFIX: link-check-http-v2-trusted-
      TRUSTED_AUDIT: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
    - name: Setup Action
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Pull request and push runs compare against an earlier commit.
        fetch-depth: 0
        persist-credentials: false
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 20.x
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        npm ci --ignore-scripts
        python -m pip install --disable-pip-version-check -r scripts/link_check/requirements.txt
    - name: Clear checkout cache evidence
      run: rm -rf -- .link-check-cache/
    - name: Restore cached successes
      if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (env.TRUSTED_AUDIT == 'true' && github.event_name == 'workflow_dispatch' && !inputs.fresh)
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .link-check-cache/
        key: ${{ env.CACHE_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ env.CACHE_PREFIX }}
    - name: Run link check
      id: link_check
      timeout-minutes: 12
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
        FRESH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.fresh) }}
        LINK_CHECK_PYTHON: python
      run: |
        case "$EVENT_NAME" in
          pull_request)
            set -- --base "$PR_BASE_SHA" ;;
          push)
            if [[ "$PUSH_BEFORE_SHA" =~ ^[0-9a-f]{40}$ && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
              set -- --local-only --base "$PUSH_BEFORE_SHA"
            else
              set -- --local-only
            fi ;;
          *)
            set -- ;;
        esac
        if [ "$FRESH" = "true" ]; then
          set -- "$@" --fresh
        fi
        npm run link-check --silent -- "$@"
    - name: Prepare link check diagnostics
      if: always()
      env:
        LINK_CHECK_OUTCOME: ${{ steps.link_check.outcome }}
      run: node scripts/Prepare_Link_Check_Diagnostics.js
    - name: Preserve link check diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: link-check-diagnostics
        path: .link-check/
        include-hidden-files: true
        if-no-files-found: warn
    - name: Save cached successes
      if: always() && env.TRUSTED_AUDIT == 'true' && hashFiles('.link-check-cache/http-success.json') != ''
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .link-check-cache/
        key: ${{ env.CACHE_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}
